# Em cada push para master e em cada PR: tipos, lint, testes, os quatro builds e o
# tour da demo de ponta a ponta. O Vercel continua a fazer os deploys.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint, testes e builds
    runs-on: ubuntu-latest
    env:
      # Só para o build não falhar; nenhum teste fala com uma Api real.
      VITE_API_BASE_URL: http://localhost:5028/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npx vite build
      - run: npx vite build --config vite.site.config.ts
      - run: npx vite build --config vite.admin.config.ts
      - run: npx vite build --mode demo --outDir dist-demo

  e2e:
    name: Tour da demo (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
