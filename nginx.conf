server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer caminho que não seja um ficheiro real cai em index.html
    # (React Router trata do resto no lado do cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ficheiros com hash no nome (Vite) podem ficar em cache por muito tempo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
